name: Windows Blender production worker control

on:
  push:
    branches: [codex/windows-optimized-121]
    paths:
      - .github/workflows/windows-blender-check.yml
      - scripts/desktop/windows_blender_smoke.py
      - scripts/desktop/windows_blender_inputs.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-blender-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blender:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
          architecture: x64
      - name: Prepare locked API environment
        run: |
          . ./scripts/windows-env.ps1
          $inputs = Get-Content tools/autocad-bridge/windows-ci-inputs.json -Raw | ConvertFrom-Json
          $python = (Get-Command python).Source
          & $python -m pip install --disable-pip-version-check ('uv==' + $inputs.uv)
          if ($LASTEXITCODE -ne 0) { throw 'uv installation failed' }
          $env:UV_PYTHON_DOWNLOADS = 'never'
          . ./scripts/windows-env.ps1
          & $python -m uv sync --project apps/api --locked --group dev --python $python
          if ($LASTEXITCODE -ne 0) { throw 'Locked API environment failed' }
      - name: Download pinned official portable Blender only for CI
        run: |
          . ./scripts/windows-env.ps1
          $blenderInputs = Get-Content scripts/desktop/windows_blender_inputs.json -Raw | ConvertFrom-Json
          if ($blenderInputs.url -notlike 'https://download.blender.org/release/*') { throw 'Not the official Blender source' }
          $root = Join-Path $env:GITHUB_WORKSPACE '.runtime/B'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $zip = Join-Path $root 'blender.zip'
          Invoke-WebRequest -Uri $blenderInputs.url -OutFile $zip
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne $blenderInputs.sha256) { throw 'Blender SHA mismatch' }
          [IO.Compression.ZipFile]::ExtractToDirectory($zip, (Join-Path $root 'portable'))
      - name: Execute production PNG and preview GLB workers with generated assets
        run: |
          . ./scripts/windows-env.ps1
          $blender = Join-Path $env:GITHUB_WORKSPACE '.runtime/B/portable/blender-4.5.11-windows-x64/blender.exe'
          & ./apps/api/.venv/Scripts/python.exe scripts/desktop/windows_blender_smoke.py --blender $blender --output .runtime/autocad-bridge/blender-native-control
          if ($LASTEXITCODE -ne 0) { throw 'Real Blender worker control failed' }
      - name: Preserve only generated evidence, never the Blender distribution
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-blender-control-${{ github.sha }}
          path: |
            .runtime/autocad-bridge/blender-native-control/receipt.json
            .runtime/autocad-bridge/blender-native-control/seed.log
            .runtime/autocad-bridge/blender-native-control/renders/*/image.png
            .runtime/autocad-bridge/blender-native-control/renders/*/receipt.json
            .runtime/autocad-bridge/blender-native-control/renders/*/renderer-receipt.json
            .runtime/autocad-bridge/blender-native-control/renders/*/blender.log
            .runtime/autocad-bridge/blender-native-control/preview-cache/*/blender.log
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
