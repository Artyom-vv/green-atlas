name: Full Windows Setup candidate

on:
  push:
    branches: [codex/windows-launch-boundary, codex/windows-installer-ui]
    paths:
      - .github/workflows/windows-product-build.yml
      - tools/autocad-bridge/ci-windows-product.ps1
      - tools/autocad-bridge/ci-windows-product-install.ps1
      - tools/autocad-bridge/windows-product-inputs.json
      - tools/autocad-bridge/installer/windows/**
      - scripts/desktop/windows_wizard_smoke.py
  workflow_dispatch:
    inputs:
      publish_draft:
        description: 'Upload the accepted Setup to a new draft release in green-atlas-dev'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-product-${{ github.ref }}-${{ inputs.publish_draft && 'draft' || 'check' }}
  cancel-in-progress: true

jobs:
  product:
    # No PR events; write access supports the explicit final draft upload.
    # Checkout never persists credentials.
    if: ${{ github.repository == 'Artyom-vv/green-atlas-dev' }}
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
          architecture: x64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          architecture: x64
      - name: Prepare locked build dependencies
        run: |
          . ./scripts/windows-env.ps1
          $ErrorActionPreference = 'Stop'
          $inputs = Get-Content tools/autocad-bridge/windows-ci-inputs.json -Raw | ConvertFrom-Json
          $product = Get-Content tools/autocad-bridge/windows-product-inputs.json -Raw | ConvertFrom-Json
          $python = (Get-Command python).Source
          & $python -m pip install --disable-pip-version-check ('uv==' + $inputs.uv)
          if ($LASTEXITCODE -ne 0) { throw 'uv installation failed' }
          $env:UV_PYTHON_DOWNLOADS = 'never'
          . ./scripts/windows-env.ps1
          & $python -m uv sync --project apps/api --locked --group dev --python $python
          if ($LASTEXITCODE -ne 0) { throw 'Locked API dependencies failed' }
          . ./scripts/windows-env.ps1
          & $python -m uv pip install --python apps/api/.venv/Scripts/python.exe -r tools/autocad-bridge/desktop/build-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller dependencies failed' }
          $nodeTools = Join-Path $env:GITHUB_WORKSPACE '.runtime/tools/node'
          . ./scripts/windows-env.ps1
          & npm install --prefix $nodeTools --no-audit --no-fund ('pnpm@' + $product.pnpm)
          if ($LASTEXITCODE -ne 0) { throw 'Pinned pnpm installation failed' }
          (Join-Path $nodeTools 'node_modules/.bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = (Join-Path $nodeTools 'node_modules/.bin') + [IO.Path]::PathSeparator + $env:PATH
          . ./scripts/windows-env.ps1
          & pnpm install --frozen-lockfile --store-dir (Join-Path $env:GITHUB_WORKSPACE '.runtime/cache/pnpm-store')
          if ($LASTEXITCODE -ne 0) { throw 'Locked Web dependencies failed' }
      - name: Verify ordinary-user harness and graceful owned-tree exit
        timeout-minutes: 3
        run: |
          . ./scripts/windows-env.ps1
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'apps/api'
          & ./apps/api/.venv/Scripts/python.exe -m pytest -o addopts= -q --tb=short scripts/desktop/test_windows_product_install_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Ordinary-user harness self-tests failed' }
      - name: Verify shared history and workspace Web contracts on Windows
        run: |
          . ./scripts/windows-env.ps1
          & pnpm --filter @green/api-client test
          if ($LASTEXITCODE -ne 0) { throw 'API client tests failed' }
          . ./scripts/windows-env.ps1
          & pnpm --filter @green/web exec vitest run src/features/component-settings/ComponentSettings.test.tsx src/shared/desktop/desktopBridge.channels.test.ts src/features/plan-history/api/history.test.ts src/features/plan-history/model/usePlanHistoryCommands.test.tsx src/features/workspace/api/workspaceQueries.test.ts src/widgets/workspace/model/viewport/useWorkspaceSceneSession.test.tsx
          if ($LASTEXITCODE -ne 0) { throw 'Windows history/workspace Web tests failed' }
          . ./scripts/windows-env.ps1
          & ./apps/api/.venv/Scripts/python.exe -m pytest -o addopts= -q --tb=short apps/api/tests/test_external_tools_settings.py apps/api/tests/test_blender_runtime.py apps/api/tests/test_native_installation_descriptors.py apps/api/tests/test_desktop_web.py
          if ($LASTEXITCODE -ne 0) { throw 'External component settings contracts failed' }
      - name: Build every production component and full offline Setup
        id: build_product
        run: |
          . ./scripts/windows-env.ps1
          & ./tools/autocad-bridge/ci-windows-product.ps1 -BuildPython (Join-Path $env:GITHUB_WORKSPACE 'apps/api/.venv/Scripts/python.exe')
      - name: Exercise the bundled Microsoft machine prerequisite separately
        run: |
          . ./scripts/windows-env.ps1
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'apps/api'
          & ./apps/api/.venv/Scripts/python.exe scripts/desktop/windows_prerequisite_smoke.py --product .runtime/autocad-bridge/ci-product
          if ($LASTEXITCODE -ne 0) { throw 'Bundled offline Microsoft machine prerequisite failed' }
      - name: Install and exercise actual Setup as a standard user
        run: |
          . ./scripts/windows-env.ps1
          $receipt = Get-Content .runtime/autocad-bridge/ci-product/deliverable/product-build-receipt.json -Raw | ConvertFrom-Json
          $setup = $receipt.backend
          & ./tools/autocad-bridge/ci-windows-product-install.ps1 -SetupPath $setup -SetupReceipt (Join-Path $env:GITHUB_WORKSPACE '.runtime/autocad-bridge/ci-product/evidence/setup-build-receipt.json') -BuildPython (Join-Path $env:GITHUB_WORKSPACE 'apps/api/.venv/Scripts/python.exe') -OutputDirectory '.runtime/autocad-bridge/ci-product/install-smoke'
      - name: Exercise the visible native wizard under a separate standard user
        run: |
          . ./scripts/windows-env.ps1
          $receipt = Get-Content .runtime/autocad-bridge/ci-product/deliverable/product-build-receipt.json -Raw | ConvertFrom-Json
          $setup = Join-Path $env:GITHUB_WORKSPACE ('.runtime/autocad-bridge/ci-product/deliverable/' + $receipt.setup)
          & ./tools/autocad-bridge/ci-windows-product-install.ps1 -SetupPath $setup -SetupReceipt (Join-Path $env:GITHUB_WORKSPACE '.runtime/autocad-bridge/ci-product/evidence/wizard-build-receipt.json') -BuildPython (Join-Path $env:GITHUB_WORKSPACE 'apps/api/.venv/Scripts/python.exe') -OutputDirectory '.runtime/autocad-bridge/ci-product/wizard-smoke' -HelperScript scripts/desktop/windows_wizard_smoke.py -TimeoutSeconds 1200
      - name: Upgrade the pinned released119 installer under another standard user
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/windows-env.ps1
          $control = (Get-Content tools/autocad-bridge/windows-product-inputs.json -Raw | ConvertFrom-Json).upgrade_control
          if ($control.repository -ne 'Artyom-vv/green-atlas-dev') { throw 'Wrong upgrade control repository' }
          $previousRoot = Join-Path $env:GITHUB_WORKSPACE '.runtime/autocad-bridge/ci-product/previous'
          New-Item -ItemType Directory -Path $previousRoot | Out-Null
          . ./scripts/windows-env.ps1
          & gh release download $control.tag --repo $control.repository --pattern $control.asset --dir $previousRoot
          if ($LASTEXITCODE -ne 0) { throw 'Pinned previous release download failed' }
          if ((Get-FileHash -LiteralPath (Join-Path $previousRoot $control.asset) -Algorithm SHA256).Hash -ne $control.sha256) { throw 'Previous Setup SHA mismatch' }
          $root = Join-Path $env:GITHUB_WORKSPACE '.runtime/autocad-bridge/ci-product'
          $receipt = Get-Content (Join-Path $root 'deliverable/product-build-receipt.json') -Raw | ConvertFrom-Json
          . ./scripts/windows-env.ps1
          & ./tools/autocad-bridge/ci-windows-product-install.ps1 -SetupPath (Join-Path $root ('deliverable/' + $receipt.setup)) -SetupReceipt (Join-Path $root 'evidence/wizard-build-receipt.json') -BuildPython (Join-Path $env:GITHUB_WORKSPACE 'apps/api/.venv/Scripts/python.exe') -OutputDirectory '.runtime/autocad-bridge/ci-product/upgrade-smoke' -HelperScript scripts/desktop/windows_upgrade_smoke.py -TimeoutSeconds 1200
      - name: Retain acceptance scope with the exact installer
        run: |
          . ./scripts/windows-env.ps1
          $root = Join-Path $env:GITHUB_WORKSPACE '.runtime/autocad-bridge/ci-product'
          $report = Get-Content (Join-Path $root 'install-smoke/user-checks/install-ci-receipt.json') -Raw | ConvertFrom-Json
          $build = Get-Content (Join-Path $root 'deliverable/product-build-receipt.json') -Raw | ConvertFrom-Json
          if ($report.passed -ne $true -or $report.setup_sha256 -ne $build.backend_sha256 -or $report.source_manifest_sha256 -ne $build.source_manifest_sha256) { throw 'Backend установка не соответствует собранному Setup.' }
          $wizard = Get-Content (Join-Path $root 'wizard-smoke/user-checks/install-ci-receipt.json') -Raw | ConvertFrom-Json
          if ($wizard.passed -ne $true -or $wizard.setup_sha256 -ne $build.sha256) { throw 'Нет приёмки настоящего native мастера.' }
          Copy-Item -LiteralPath (Join-Path $root 'wizard-smoke/user-checks/install-ci-receipt.json') -Destination (Join-Path $root 'deliverable/wizard-checks.json')
          $machine = Get-Content (Join-Path $root 'evidence/machine-webview2-upgrade.json') -Raw | ConvertFrom-Json
          if ($machine.passed -ne $true -or $machine.sealed_payload_bytes_verified -ne $true -or $machine.git_commit -ne $build.git_commit) { throw 'Нет отдельной квитанции Microsoft machine prerequisite.' }
          Copy-Item -LiteralPath (Join-Path $root 'install-smoke/user-checks/install-ci-receipt.json') -Destination (Join-Path $root 'deliverable/installation-checks.json')
          Copy-Item -LiteralPath (Join-Path $root 'evidence/machine-webview2-upgrade.json') -Destination (Join-Path $root 'deliverable/machine-prerequisite-checks.json')
          $upgrade = Get-Content (Join-Path $root 'upgrade-smoke/user-checks/install-ci-receipt.json') -Raw | ConvertFrom-Json
          if ($upgrade.passed -ne $true -or $upgrade.setup_sha256 -ne $build.sha256 -or $upgrade.different_version_update_tested -ne $true) { throw 'No accepted119 to current upgrade' }
          Copy-Item -LiteralPath (Join-Path $root 'upgrade-smoke/user-checks/install-ci-receipt.json') -Destination (Join-Path $root 'deliverable/upgrade-checks.json')
      - name: Upload accepted installer to a new draft release
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.publish_draft && github.repository == 'Artyom-vv/green-atlas-dev' && github.ref == 'refs/heads/codex/windows-optimized-121' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/windows-env.ps1
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $root = Join-Path $env:GITHUB_WORKSPACE '.runtime/autocad-bridge/ci-product'
          $deliverable = Join-Path $root 'deliverable'
          $build = Get-Content (Join-Path $deliverable 'product-build-receipt.json') -Raw | ConvertFrom-Json
          if ($build.git_commit -cne $env:GITHUB_SHA -or $build.product_version -notmatch '^\d+\.\d+\.\d+$') { throw 'Draft source/version mismatch' }
          $expectedName = 'GreenAtlas-' + $build.product_version + '-Windows-x64-Setup-2.exe'
          if ($build.setup -cne $expectedName) { throw 'Unexpected installer asset name' }
          $setup = Join-Path $deliverable $expectedName
          if ((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant() -cne $build.sha256 -or (Get-Item -LiteralPath $setup).Length -ne $build.bytes) { throw 'Draft installer bytes mismatch' }
          $assets = @($setup)
          foreach ($name in @('README-Windows.md', 'render-resources.example.json', 'product-build-receipt.json', 'installation-checks.json', 'wizard-checks.json', 'machine-prerequisite-checks.json', 'upgrade-checks.json')) {
            $path = Join-Path $deliverable $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing accepted deliverable: $name" }
            $assets += $path
          }
          $sums = Join-Path $deliverable 'SHA256SUMS.txt'
          $assets | ForEach-Object { (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + [IO.Path]::GetFileName($_) } | Set-Content -LiteralPath $sums -Encoding utf8NoBOM
          $assets += $sums
          $notes = Join-Path $root 'draft-release-notes.md'
          @(
            ('Windows x64 candidate ' + $build.product_version + ', commit ' + $env:GITHUB_SHA + '.'),
            '',
            'Built ARX/CRX against SDK 2027, native WebView2 host, frozen API, compiled Web and offline Setup.',
            'Standard-user install, native wizard/Finish, reinstall, released 0.1.119 upgrade and uninstall passed for this exact Setup. Check receipts and SHA256SUMS.',
            'Draft awaiting independent verification. Actual AutoCAD 2027, user Botaniq, a real prepared CAD-project migration and cold WebView2/UAC are not accepted by this CI run.',
            'Unsigned installer. Blender and plant/PBR libraries are external.',
            '',
            ('Build and checks: https://github.com/Artyom-vv/green-atlas-dev/actions/runs/' + $env:GITHUB_RUN_ID)
          ) | Set-Content -LiteralPath $notes -Encoding utf8NoBOM
          $tag = 'v' + $build.product_version + '-windows-candidate-' + $env:GITHUB_RUN_ID
          . ./scripts/windows-env.ps1
          & gh release create $tag @assets --repo Artyom-vv/green-atlas-dev --target $env:GITHUB_SHA --draft --prerelease --title ('Green Atlas ' + $build.product_version + ' Windows candidate') --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Accepted installer draft upload failed' }
      - name: Keep bounded receipt and original UI frames readable in job logs
        if: always()
        run: |
          . ./scripts/windows-env.ps1
          & ./apps/api/.venv/Scripts/python.exe scripts/desktop/windows_ci_evidence.py --root .runtime/autocad-bridge/ci-product
          if ($LASTEXITCODE -ne 0) { throw 'Owned UI evidence transport failed' }
      - name: Preserve small installation diagnostics before the installer
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-product-install-diagnostics-${{ github.sha }}
          path: |
            .runtime/autocad-bridge/ci-product/install-smoke/*.json
            .runtime/autocad-bridge/ci-product/install-smoke/*.log
            .runtime/autocad-bridge/ci-product/install-smoke/user-checks/install-ci-receipt.json
            .runtime/autocad-bridge/ci-product/install-smoke/user-checks/*.stdout.log
            .runtime/autocad-bridge/ci-product/install-smoke/user-checks/*.stderr.log
            .runtime/autocad-bridge/ci-product/wizard-smoke/*.json
            .runtime/autocad-bridge/ci-product/wizard-smoke/*.log
            .runtime/autocad-bridge/ci-product/wizard-smoke/user-checks/*
            .runtime/autocad-bridge/ci-product/upgrade-smoke/*.json
            .runtime/autocad-bridge/ci-product/upgrade-smoke/*.log
            .runtime/autocad-bridge/ci-product/upgrade-smoke/user-checks/*
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve only installer and bounded build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-product-${{ github.sha }}
          path: |
            .runtime/autocad-bridge/ci-product/deliverable/
            .runtime/autocad-bridge/ci-product/evidence/*.json
            .runtime/autocad-bridge/ci-product/evidence/*.log
            .runtime/autocad-bridge/ci-product/evidence/*.xml
            .runtime/autocad-bridge/ci-product/evidence/BuildEvidence/*.json
            .runtime/autocad-bridge/ci-product/install-smoke/*.json
            .runtime/autocad-bridge/ci-product/install-smoke/*.log
            .runtime/autocad-bridge/ci-product/install-smoke/user-checks/install-ci-receipt.json
            .runtime/autocad-bridge/ci-product/install-smoke/user-checks/*.stdout.log
            .runtime/autocad-bridge/ci-product/install-smoke/user-checks/*.stderr.log
            .runtime/autocad-bridge/ci-product/wizard-smoke/*.json
            .runtime/autocad-bridge/ci-product/wizard-smoke/*.log
            .runtime/autocad-bridge/ci-product/wizard-smoke/user-checks/*
            .runtime/autocad-bridge/ci-product/upgrade-smoke/*.json
            .runtime/autocad-bridge/ci-product/upgrade-smoke/*.log
            .runtime/autocad-bridge/ci-product/upgrade-smoke/user-checks/*
            .runtime/autocad-bridge/windows-distribution/build-*/setup-build.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
