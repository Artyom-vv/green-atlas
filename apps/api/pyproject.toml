[project]
name = "green-atlas-api"
version = "0.1.0"
description = "Deterministic modular backend for the Green Atlas prototype"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4.8,<5",
  "ezdxf>=1.4,<2",
  "fastapi>=0.135,<1",
  "ijson>=3.5,<4",
  "numpy>=2,<3",
  "httpx[socks]>=0.28,<1",
  "pydantic>=2.10,<3",
  "psutil>=7.2,<8",
  "python-multipart>=0.0.20,<1",
  "shapely>=2.1,<3",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.3,<9",
  "pytest-timeout>=2.4,<3",
  "ruff>=0.12,<1",
  "types-shapely>=2.1,<3",
  "types-psutil>=7.2,<8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88
# Модули проверяются вместе со сценарием их миграции.
# Полная диагностическая проверка остаётся доступной отдельно.
