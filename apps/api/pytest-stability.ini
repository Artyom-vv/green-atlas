[pytest]
# Быстрые сценарии продолжения проекта; временные базы и готовая геометрия.
pythonpath = .
testpaths =
    tests/test_prepared_geometry.py
    tests/test_local_project_api.py
    tests/test_planning_horizon.py
    tests/test_planting_zone_changes.py
    tests/test_change_receipts.py
    tests/test_project_mutation_receipts.py
    tests/test_desktop_handoff.py
    tests/test_operation_events.py
    tests/test_operations.py
    tests/test_layer_recognition_local_first.py
addopts = -q --maxfail=1 --durations=5
required_plugins = pytest-timeout>=2.4,<3
timeout = 5
timeout_method = thread
