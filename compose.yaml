name: green-atlas

services:
  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
      target: api
    init: true
    environment:
      GREEN_ATLAS_DB_PATH: /var/lib/green-atlas/projects.sqlite3
      GREEN_ATLAS_LOCAL_MODEL: ""
    volumes:
      - project-data:/var/lib/green-atlas
    expose:
      - "8000"
    stop_grace_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
      target: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GREEN_ATLAS_WEB_PORT:-8080}:8080"
    restart: unless-stopped

  api-test:
    profiles: [test]
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
      target: api-test
    init: true

volumes:
  project-data:
