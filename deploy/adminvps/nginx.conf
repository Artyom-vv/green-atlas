limit_req_zone $binary_remote_addr zone=green_api:10m rate=10r/s;

server {
    listen 80 default_server;
    server_name green-atlas.130-49-146-234.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/green-atlas-acme; }
    location / { return 301 https://green-atlas.130-49-146-234.sslip.io$request_uri; }
}

server {
    listen 443 ssl;
    server_name green-atlas.130-49-146-234.sslip.io;
    ssl_certificate /etc/letsencrypt/live/green-atlas.130-49-146-234.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/green-atlas.130-49-146-234.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "Green Atlas beta";
    auth_basic_user_file /etc/nginx/green-atlas.htpasswd;
    root /opt/green-atlas/current/web;
    index index.html;
    client_max_body_size 125m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        limit_req zone=green_api burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
